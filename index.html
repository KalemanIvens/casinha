.row{border-radius:28px;padding:14px 16px}.ic{width:46px;height:46px;border-radius:50%;background:var(--bg)}

.msg{border-radius:22px}.warn{border-radius:28px}
/* botões e chips em pílula */
.pill{background:var(--v);color:var(--vt);font-weight:500}
.go{border-radius:99px;background:var(--li);color:#212121;font-weight:600;padding:17px}
.go.gh{background:var(--bg);color:var(--t)}.sheet .go.gh{background:var(--bg)}
.chip{background:var(--c);color:var(--m);font-weight:500;padding:10px 16px}.chip.on{background:var(--li);color:#212121}
.sheet .chip{background:var(--bg)}.sheet .chip.on{background:var(--li);color:#212121}
.chip.bk:not(.on){background:var(--bt)}
.sg{border-radius:99px;background:var(--c);padding:4px}.sg button{border-radius:99px;font-weight:500}.sg button.on{background:var(--li);color:#212121}
.sheet .sg{background:var(--bg)}
.xs{background:var(--bg)}
input,select{border-radius:99px;padding:15px 20px;background:var(--bg)}
.card input,.sheet input,.sheet select{background:var(--bg)}
.kp button{border-radius:50%;aspect-ratio:1.7/1;border-radius:99px}
.amt{font-weight:300;font-size:54px}
.tr{border-radius:50%}
.ck{border-radius:50%}.ck.on{background:var(--li);border-color:var(--li)}
/* barras, gráficos */
.cb{border-radius:16px 16px 6px 6px;width:100%;max-width:64px}.cols{gap:14px}
.pb{height:14px;border-radius:99px}.pb i{background:var(--li);border-radius:99px}
.ev .eb{border-radius:12px 12px 4px 4px;background:var(--l);max-width:34px;min-height:4px}.ev.on .eb{background:var(--li)}
.ev b{font-weight:600}
.pie circle{stroke-linecap:round}
/* navegação flutuante */
.tab>div{background:var(--tabbg);border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:7px}
.tab button[data-t]{width:64px;border-radius:99px;color:#4a4a58;font-weight:500;padding:9px 0}
.tab button.on{background:#212121;color:#fff}
.tab .add{background:var(--li);color:#212121;box-shadow:none}
.fab{background:var(--c);border:0;box-shadow:none;font-weight:500}
/* folhas */
.sheet>div{border-radius:36px 36px 0 0}
.sheet{background:rgba(33,33,33,.38)}
#toast{background:#212121;color:#fff}
.rem time{color:var(--t);font-weight:600}
.lg{padding:10px 0}
.pr input{margin:6px 0 0}
.sw.on{background:var(--v)}
:root[data-theme="dark"] .tab button[data-t]{color:#c9c9e6}:root[data-theme="dark"] .tab button.on{background:#fcfd76;color:#212121}
/* hachura de categoria */
.ic.hach{background:repeating-linear-gradient(135deg,var(--l) 0 3px,transparent 3px 7px)}

:root[data-theme="dark"] .c2{background:#0b0b0c;box-shadow:inset 0 0 0 1px #323235}
